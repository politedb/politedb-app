[package]
name = "PoliteDB"
version = "0.1.0"
description = "PoliteDB - Modern Database Management Tool"
authors = ["you"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "politedb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = ['config-json5'] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", features = ["rust_backend"] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "time",
    "sync",
] }

thiserror = "1"
anyhow = "1"
futures-util = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"

# Security: store secrets in OS Keychain (macOS Keychain)
keyring = "2"

deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true, features = [
    "with-uuid-1",
    "with-serde_json-1",
    "with-chrono-0_4",
] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"], optional = true }
native-tls = { version = "0.2", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
base64 = "0.22.1"
mysql_async = { version = "0.36.1", default-features = false, features = [
    "derive",
    "rustls-tls",
    "ring",
] }
async-trait = "0.1.89"
urlencoding = "2.1.3"
deadpool-redis = "0.22.0"
redis = "0.32.2"
raw-window-handle = "0.6.2"
tauri-plugin-dialog = "2"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
dirs = "6.0.0"
tauri-plugin-os = "2"
chrono = { version = "0.4.42", features = ["serde"] }
postgres-types = { version = "0.2.9", features = ["derive"] }
tauri-plugin-fs = "2.0.0-rc.6"
tokio-util = "0.7.18"
tauri-plugin-process = "2"

[features]
default = ["engine-postgres"]
engine-postgres = ["dep:deadpool-postgres", "dep:tokio-postgres", "dep:rust_decimal"]
pg-tls = ["dep:native-tls", "dep:postgres-native-tls"]

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc2 = "0.6.3"
objc2-foundation="0.3.2"
core-foundation = "0.10.1"
security-framework-sys = "2.15.0"
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
