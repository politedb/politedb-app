[package]
name = "politedb"
version = "0.1.0"
description = "PoliteDB - Modern Database Management Tool"
authors = ["you"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "politedb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "=2.5.3", features = [] }

[dependencies]
tauri = { version = "=2.9.5", features = ["macos-private-api"] }
tauri-plugin-opener = "=2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "time",
    "sync",
] }

thiserror = "1"
anyhow = "1"
futures-util = "0.3"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"

# Security: store secrets in OS Keychain (macOS Keychain)
keyring = "2"

deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true, features = [
    "with-uuid-1",
    "with-serde_json-1",
] }
native-tls = { version = "0.2", optional = true }
postgres-native-tls = { version = "0.5", optional = true }
base64 = "0.22.1"
mysql_async = { version = "0.36.1", default-features = false, features = [
    "derive",
    "rustls-tls",
    "ring",
] }
async-trait = "0.1.89"
urlencoding = "2.1.3"
deadpool-redis = "0.22.0"
redis = "0.32.2"
raw-window-handle = "0.6.2"

[features]
default = ["engine-postgres"]
engine-postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]
pg-tls = ["dep:native-tls", "dep:postgres-native-tls"]

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }
