name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - platform: macos-latest
            target: "aarch64-apple-darwin"
          - platform: macos-latest
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Build updater platform metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) PLATFORM_KEY="darwin-aarch64" ;;
            x86_64-apple-darwin) PLATFORM_KEY="darwin-x86_64" ;;
            *)
              echo "Unsupported target for updater metadata: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          UPDATE_FILE="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz | head -n 1)"
          SIG_FILE="${UPDATE_FILE}.sig"
          if [ ! -f "${SIG_FILE}" ]; then
            echo "Missing updater signature: ${SIG_FILE}"
            exit 1
          fi

          BASENAME="$(basename "${UPDATE_FILE}")"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${BASENAME}"
          SIGNATURE="$(tr -d '\n' < "${SIG_FILE}")"

          cat > "updater-${{ matrix.target }}.json" <<EOF
          {
            "platforms": {
              "${PLATFORM_KEY}": {
                "url": "${URL}",
                "signature": "${SIGNATURE}"
              }
            }
          }
          EOF

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: updater-${{ matrix.target }}.json

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig

  publish-latest-json:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download updater metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-metadata
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          jq -s --arg version "${VERSION}" --arg pub_date "${PUB_DATE}" '
            reduce .[] as $item (
              {
                version: $version,
                pub_date: $pub_date,
                platforms: {}
              };
              .platforms += ($item.platforms // {})
            )
          ' updater-metadata/*.json > latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
