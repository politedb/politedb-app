name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v0.18.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

env:
  RELEASE_REPOSITORY: politedb/PoliteDB

jobs:
  build-macos-installers:
    permissions:
      contents: write
    env:
      VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED }}
      VITE_ANALYTICS_DEBUG: "false"
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POLITEDB_API_BASE: ${{ vars.VITE_POLITEDB_API_BASE }}
      VITE_LICENSE_PRODUCT: ${{ vars.VITE_LICENSE_PRODUCT || 'politedb' }}
      BUNDLE_AI_ASSISTANT: ${{ vars.BUNDLE_AI_ASSISTANT || 'true' }}
      BUNDLE_AI_MODEL: ${{ vars.BUNDLE_AI_MODEL || 'false' }}
      AI_MODEL_REPO: ${{ vars.AI_MODEL_REPO || 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF' }}
      AI_MODEL_PATTERN: ${{ vars.AI_MODEL_PATTERN || 'qwen2.5-coder-7b-instruct-q4_k_m*.gguf' }}
      AI_LLAMA_REF: ${{ vars.AI_LLAMA_REF || 'master' }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

    strategy:
      matrix:
        include:
          - platform: macos-14
            target: "aarch64-apple-darwin"
          - platform: macos-15-intel
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Install Rust target
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        if: env.BUNDLE_AI_ASSISTANT == 'true' && env.BUNDLE_AI_MODEL == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Install AI build dependencies
        if: env.BUNDLE_AI_ASSISTANT == 'true' && env.BUNDLE_AI_MODEL == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip huggingface_hub[cli]

      - name: Print build env summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Analytics enabled: ${VITE_ANALYTICS_ENABLED:-<unset>}"
          echo "PostHog host set: $([ -n "${VITE_POSTHOG_HOST:-}" ] && echo yes || echo no)"
          echo "PostHog key set: $([ -n "${VITE_POSTHOG_KEY:-}" ] && echo yes || echo no)"
          echo "PoliteDB API base set: $([ -n "${VITE_POLITEDB_API_BASE:-}" ] && echo yes || echo no)"
          echo "License product: ${VITE_LICENSE_PRODUCT:-<unset>}"
          echo "Bundle AI assistant: ${BUNDLE_AI_ASSISTANT:-false}"
          echo "Bundle AI model: ${BUNDLE_AI_MODEL:-false}"
          echo "AI model repo: ${AI_MODEL_REPO:-<unset>}"
          echo "AI model pattern: ${AI_MODEL_PATTERN:-<unset>}"
          echo "AI llama ref: ${AI_LLAMA_REF:-<unset>}"
          echo "Apple API key id set: $([ -n "${APPLE_API_KEY_ID:-}" ] && echo yes || echo no)"
          echo "Apple API issuer set: $([ -n "${APPLE_API_ISSUER:-}" ] && echo yes || echo no)"
          echo "Apple team id set: $([ -n "${APPLE_TEAM_ID:-}" ] && echo yes || echo no)"
          echo "Apple API key content set: $([ -n "${APPLE_API_KEY_CONTENT:-}" ] && echo yes || echo no)"

      - name: Validate distribution release token
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          GH_TOKEN="${CLEAN_TOKEN}" gh api "repos/${RELEASE_REPOSITORY}" >/dev/null

      - name: Prepare Apple API key env
        if: env.APPLE_API_KEY_CONTENT != ''
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ env.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "Missing APPLE_API_KEY_ID"
            exit 1
          fi

          if [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "Missing APPLE_API_ISSUER"
            exit 1
          fi

          KEY_DIR="$RUNNER_TEMP/apple-api-key"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_CONTENT" | perl -pe 's/\\n/\n/g' | tr -d '\r' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "APPLE_API_KEY must contain the .p8 private key content, not the key id or a local file path."
            exit 1
          fi

          # Tauri expects APPLE_API_KEY to be the App Store Connect key id.
          echo "APPLE_API_KEY=${APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"

          echo "Prepared Apple API key file: ${KEY_PATH}"

      - name: Validate macOS signing secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID APPLE_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/env: ${name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "macOS signing/notarization secrets are incomplete. Refusing to publish unsigned artifact."
            exit 1
          fi

      - name: Validate Apple notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            >/dev/null

      - name: Import Apple signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_CONTENT: ${{ env.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_VALUE: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/apple-certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$APPLE_CERTIFICATE_CONTENT" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD_VALUE" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "APPLE_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Download bundled AI runtime
        if: env.BUNDLE_AI_ASSISTANT == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_REPO: ${{ env.AI_MODEL_REPO }}
          MODEL_PATTERN: ${{ env.AI_MODEL_PATTERN }}
          LLAMA_REF: ${{ env.AI_LLAMA_REF }}
          DOWNLOAD_MODEL: ${{ env.BUNDLE_AI_MODEL }}
          TARGET_TRIPLE: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "13.3"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/setup_llama_runtime.sh
          chmod +x ./scripts/download_default_ai_runtime.sh
          ./scripts/download_default_ai_runtime.sh

      - name: Verify bundled AI assets
        if: env.BUNDLE_AI_ASSISTANT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/resources/ai/bin/macos/llama-server
          ls -lh src-tauri/resources/ai/bin/macos/llama-server
          find src-tauri/resources/ai/bin/macos -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -print
          otool -L src-tauri/resources/ai/bin/macos/llama-server
          otool -l src-tauri/resources/ai/bin/macos/llama-server | grep -n -E "LC_RPATH|[[:space:]]path "
          if [ "${BUNDLE_AI_MODEL}" = "true" ]; then
            test -f src-tauri/resources/ai/models/default.gguf
            ls -lh src-tauri/resources/ai/models/default.gguf
          else
            echo "Skipping bundled model verification"
          fi

      - name: Sign bundled AI runtime
        if: env.BUNDLE_AI_ASSISTANT == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/sign-macos-libs.sh
          ./scripts/sign-macos-libs.sh

      - name: Build Tauri
        env:
          # GitHub Actions sets CI=true by default; Tauri skips DMG layout (windowSize,
          # appPosition, etc.) in that mode. See https://github.com/tauri-apps/tauri-action/issues/740
          CI: false
          NODE_ENV: production
          MACOSX_DEPLOYMENT_TARGET: "13.3"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      # Tauri notarizes/staples the .app; the .dmg is produced afterward and often has no stapled ticket.
      - name: Notarize and staple DMG (if needed)
        shell: bash
        run: |
          set -euo pipefail

          DMG_PATH="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type f -name '*.dmg' -print | head -n 1)"
          if [ -z "${DMG_PATH}" ] || [ ! -f "${DMG_PATH}" ]; then
            echo "Could not find DMG under src-tauri/target for ${{ matrix.target }}"
            exit 1
          fi

          echo "DMG path: ${DMG_PATH}"

          if xcrun stapler validate "${DMG_PATH}" >/dev/null 2>&1; then
            echo "DMG already has a stapled notarization ticket; skipping submit."
            exit 0
          fi

          echo "Submitting DMG for notarization, then stapling..."
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${APPLE_API_KEY_PATH}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            ${APPLE_TEAM_ID:+--team-id "${APPLE_TEAM_ID}"} \
            --wait

          xcrun stapler staple "${DMG_PATH}"

      - name: Verify code signing and notarization
        shell: bash
        run: |
          set -euo pipefail

          echo "Available bundle artifacts:"
          find "src-tauri/target" -path '*/release/bundle/*' -print || true

          APP_PATH="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type d -name '*.app' -print | head -n 1)"
          DMG_PATH="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type f -name '*.dmg' -print | head -n 1)"

          if [ -z "${APP_PATH}" ] || [ ! -e "${APP_PATH}" ]; then
            UPDATE_ARCHIVE="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type f -name '*.tar.gz' -print | head -n 1)"
            if [ -n "${UPDATE_ARCHIVE}" ] && [ -f "${UPDATE_ARCHIVE}" ]; then
              EXTRACT_DIR="$RUNNER_TEMP/app-bundle-${{ matrix.target }}"
              mkdir -p "${EXTRACT_DIR}"
              tar -xzf "${UPDATE_ARCHIVE}" -C "${EXTRACT_DIR}"
              APP_PATH="$(find "${EXTRACT_DIR}" -type d -name '*.app' -print | head -n 1)"
            fi
          fi

          if [ -z "${APP_PATH}" ] || [ ! -e "${APP_PATH}" ]; then
            echo "Could not find app bundle for verification in bundle output or updater archive."
            exit 1
          fi

          if [ -z "${DMG_PATH}" ] || [ ! -e "${DMG_PATH}" ]; then
            echo "Could not find dmg for verification."
            exit 1
          fi

          echo "Verifying app signature: ${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

          echo "Verifying dmg notarization ticket: ${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"
          spctl -a -vv -t open --context context:primary-signature "${DMG_PATH}"

      - name: Verify bundled AI runtime inside app bundle
        if: env.BUNDLE_AI_ASSISTANT == 'true'
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type d -name '*.app' -print | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            UPDATE_ARCHIVE="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type f -name '*.tar.gz' -print | head -n 1)"
            if [ -n "${UPDATE_ARCHIVE}" ] && [ -f "${UPDATE_ARCHIVE}" ]; then
              EXTRACT_DIR="$RUNNER_TEMP/ai-app-bundle-${{ matrix.target }}"
              mkdir -p "${EXTRACT_DIR}"
              tar -xzf "${UPDATE_ARCHIVE}" -C "${EXTRACT_DIR}"
              APP_PATH="$(find "${EXTRACT_DIR}" -type d -name '*.app' -print | head -n 1)"
            fi
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "Could not find built .app bundle in bundle output or updater archive."
            echo "Available bundle artifacts:"
            find "src-tauri/target" -path '*/release/bundle/*' -print || true
            exit 1
          fi

          echo "Checking app bundle: ${APP_PATH}"
          RESOURCE_DIR="${APP_PATH}/Contents/Resources"
          if [ ! -d "${RESOURCE_DIR}" ]; then
            echo "Missing Resources directory in app bundle: ${RESOURCE_DIR}"
            exit 1
          fi

          LLAMA_BIN="$(find "${RESOURCE_DIR}" -type f -name 'llama-server' | head -n 1)"
          if [ -z "${LLAMA_BIN}" ]; then
            echo "Bundled llama-server was not found inside ${RESOURCE_DIR}"
            echo "Resource tree:"
            find "${RESOURCE_DIR}" -print
            exit 1
          fi

          echo "Found bundled llama-server:"
          ls -lh "${LLAMA_BIN}"
          echo "Sibling AI runtime libraries inside app bundle:"
          find "$(dirname "${LLAMA_BIN}")" -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) -print
          otool -L "${LLAMA_BIN}"
          otool -l "${LLAMA_BIN}" | grep -n -E "LC_RPATH|[[:space:]]path "

          if otool -L "${LLAMA_BIN}" | grep -q '/Users/runner/work/'; then
            echo "Build-time absolute paths leaked into llama-server dependencies."
            exit 1
          fi

          if otool -l "${LLAMA_BIN}" | grep -q '/Users/runner/work/'; then
            echo "Build-time absolute rpath leaked into llama-server."
            exit 1
          fi

          while IFS= read -r dylib; do
            test -f "$(dirname "${LLAMA_BIN}")/$(basename "${dylib}")"
          done < <(otool -L "${LLAMA_BIN}" | awk '/@rpath\/.*\.dylib/ {print $1}')

      - name: Rename updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH_LABEL="aarch64" ;;
            x86_64-apple-darwin) ARCH_LABEL="x86_64" ;;
            *)
              echo "Unsupported target for renaming: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          UPDATE_FILE="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type f -name '*.tar.gz' -print | head -n 1)"
          SIG_FILE="${UPDATE_FILE}.sig"
          if [ ! -f "${SIG_FILE}" ]; then
            echo "Missing updater signature: ${SIG_FILE}"
            exit 1
          fi

          NEW_BASENAME="PoliteDB-${ARCH_LABEL}.app.tar.gz"
          NEW_UPDATE_FILE="$(dirname "${UPDATE_FILE}")/${NEW_BASENAME}"
          NEW_SIG_FILE="${NEW_UPDATE_FILE}.sig"

          mv "${UPDATE_FILE}" "${NEW_UPDATE_FILE}"
          mv "${SIG_FILE}" "${NEW_SIG_FILE}"

      - name: Build updater platform metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) PLATFORM_KEY="darwin-aarch64" ;;
            x86_64-apple-darwin) PLATFORM_KEY="darwin-x86_64" ;;
            *)
              echo "Unsupported target for updater metadata: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          UPDATE_FILE="$(find "src-tauri/target" -path "*/${{ matrix.target }}/*" -type f -name '*.tar.gz' -print | head -n 1)"
          SIG_FILE="${UPDATE_FILE}.sig"
          if [ ! -f "${SIG_FILE}" ]; then
            echo "Missing updater signature: ${SIG_FILE}"
            exit 1
          fi

          BASENAME="$(basename "${UPDATE_FILE}")"
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          URL="https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${BASENAME}"
          SIGNATURE="$(tr -d '\n' < "${SIG_FILE}")"

          cat > "updater-${{ matrix.target }}.json" <<EOF
          {
            "platforms": {
              "${PLATFORM_KEY}": {
                "url": "${URL}",
                "signature": "${SIGNATURE}"
              }
            }
          }
          EOF

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.target }}
          path: updater-${{ matrix.target }}.json

      - name: Upload macOS installers
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)

          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS installers found to upload."
            exit 1
          fi

          if ! GH_TOKEN="${CLEAN_TOKEN}" gh release view "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            GH_TOKEN="${CLEAN_TOKEN}" gh release create "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" --title "${TAG_NAME}" --generate-notes
          fi

          GH_TOKEN="${CLEAN_TOKEN}" gh release upload "${TAG_NAME}" "${files[@]}" --repo "${RELEASE_REPOSITORY}" --clobber

  build-linux-windows-installers:
    permissions:
      contents: write
    env:
      VITE_ANALYTICS_ENABLED: ${{ vars.VITE_ANALYTICS_ENABLED }}
      VITE_ANALYTICS_DEBUG: "false"
      VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
      VITE_POLITEDB_API_BASE: ${{ vars.VITE_POLITEDB_API_BASE }}
      VITE_LICENSE_PRODUCT: ${{ vars.VITE_LICENSE_PRODUCT || 'politedb' }}
      BUNDLE_AI_ASSISTANT: ${{ vars.BUNDLE_AI_ASSISTANT || 'true' }}
      BUNDLE_AI_MODEL: ${{ vars.BUNDLE_AI_MODEL || 'false' }}
      AI_MODEL_REPO: ${{ vars.AI_MODEL_REPO || 'Qwen/Qwen2.5-Coder-7B-Instruct-GGUF' }}
      AI_MODEL_PATTERN: ${{ vars.AI_MODEL_PATTERN || 'qwen2.5-coder-7b-instruct-q4_k_m*.gguf' }}
      AI_LLAMA_REF: ${{ vars.AI_LLAMA_REF || 'master' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_label: linux
          - platform: windows-2022
            os_label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os_label == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Python
        if: env.BUNDLE_AI_ASSISTANT == 'true' && env.BUNDLE_AI_MODEL == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install

      - name: Install AI build dependencies
        if: env.BUNDLE_AI_ASSISTANT == 'true' && env.BUNDLE_AI_MODEL == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip huggingface_hub[cli]

      - name: Validate updater signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Missing required secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Validate distribution release token
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          GH_TOKEN="${CLEAN_TOKEN}" gh api "repos/${RELEASE_REPOSITORY}" >/dev/null

      - name: Prepare Windows signing certificate
        if: matrix.os_label == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "Missing required secret: WINDOWS_CERTIFICATE"
          }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Missing required secret: WINDOWS_CERTIFICATE_PASSWORD"
          }

          $certPath = Join-Path $env:RUNNER_TEMP "politedb-windows-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          "WINDOWS_CERTIFICATE_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Print build env summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Platform: ${{ matrix.os_label }}"
          echo "Analytics enabled: ${VITE_ANALYTICS_ENABLED:-<unset>}"
          echo "PostHog host set: $([ -n "${VITE_POSTHOG_HOST:-}" ] && echo yes || echo no)"
          echo "PostHog key set: $([ -n "${VITE_POSTHOG_KEY:-}" ] && echo yes || echo no)"
          echo "PoliteDB API base set: $([ -n "${VITE_POLITEDB_API_BASE:-}" ] && echo yes || echo no)"
          echo "License product: ${VITE_LICENSE_PRODUCT:-<unset>}"
          echo "Bundle AI assistant: ${BUNDLE_AI_ASSISTANT:-false}"
          echo "Bundle AI model: ${BUNDLE_AI_MODEL:-false}"
          echo "AI model repo: ${AI_MODEL_REPO:-<unset>}"
          echo "AI model pattern: ${AI_MODEL_PATTERN:-<unset>}"
          echo "AI llama ref: ${AI_LLAMA_REF:-<unset>}"
          echo "Tauri updater signing key set: $([ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && echo yes || echo no)"
          echo "Windows signing cert path set: $([ -n "${WINDOWS_CERTIFICATE_PATH:-}" ] && echo yes || echo no)"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Download bundled AI runtime
        if: env.BUNDLE_AI_ASSISTANT == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_REPO: ${{ env.AI_MODEL_REPO }}
          MODEL_PATTERN: ${{ env.AI_MODEL_PATTERN }}
          LLAMA_REF: ${{ env.AI_LLAMA_REF }}
          DOWNLOAD_MODEL: ${{ env.BUNDLE_AI_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/setup_llama_runtime.sh
          chmod +x ./scripts/download_default_ai_runtime.sh
          ./scripts/download_default_ai_runtime.sh

      - name: Verify bundled AI assets
        if: env.BUNDLE_AI_ASSISTANT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os_label }}" in
            linux)
              test -f src-tauri/resources/ai/bin/linux/llama-server
              ls -lh src-tauri/resources/ai/bin/linux/llama-server
              find src-tauri/resources/ai/bin/linux -type f \( -name '*.so' -o -name '*.dll' \) -print
              ;;
            windows)
              test -f src-tauri/resources/ai/bin/windows/llama-server.exe
              ls -lh src-tauri/resources/ai/bin/windows/llama-server.exe
              find src-tauri/resources/ai/bin/windows -type f \( -name '*.dll' -o -name '*.so' \) -print
              ;;
          esac
          if [ "${BUNDLE_AI_MODEL}" = "true" ]; then
            test -f src-tauri/resources/ai/models/default.gguf
            ls -lh src-tauri/resources/ai/models/default.gguf
          else
            echo "Skipping bundled model verification"
          fi

      - name: Build Tauri installers
        env:
          NODE_ENV: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Verify Windows code signatures
        if: matrix.os_label == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path "src-tauri/target/release" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi" }

          if ($files.Count -eq 0) {
            throw "No Windows executable or installer files found for signature verification."
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            Write-Host "$($file.FullName): $($signature.Status)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
          }

      - name: List bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          find src-tauri/target/release/bundle -maxdepth 5 -type f -print

      - name: Build updater platform metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os_label }}" in
            linux) PLATFORM_KEY="linux-x86_64" ;;
            windows) PLATFORM_KEY="windows-x86_64" ;;
            *)
              echo "Unsupported platform for updater metadata: ${{ matrix.os_label }}"
              exit 1
              ;;
          esac

          SIG_FILE="$(find "src-tauri/target/release/bundle" -type f -name '*.sig' -print | head -n 1)"
          if [ -z "${SIG_FILE}" ] || [ ! -f "${SIG_FILE}" ]; then
            echo "Missing updater signature under src-tauri/target/release/bundle"
            exit 1
          fi

          UPDATE_FILE="${SIG_FILE%.sig}"
          if [ ! -f "${UPDATE_FILE}" ]; then
            echo "Missing updater artifact for signature: ${SIG_FILE}"
            exit 1
          fi

          BASENAME="$(basename "${UPDATE_FILE}")"
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          URL="https://github.com/${RELEASE_REPOSITORY}/releases/download/${TAG_NAME}/${BASENAME}"
          SIGNATURE="$(tr -d '\n' < "${SIG_FILE}")"

          cat > "updater-${{ matrix.os_label }}.json" <<EOF
          {
            "platforms": {
              "${PLATFORM_KEY}": {
                "url": "${URL}",
                "signature": "${SIGNATURE}"
              }
            }
          }
          EOF

      - name: Upload updater metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.os_label }}
          path: updater-${{ matrix.os_label }}.json

      - name: Upload Linux installers
        if: matrix.os_label == 'linux'
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find "src-tauri/target/release/bundle" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)

          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux installers found to upload."
            exit 1
          fi

          if ! GH_TOKEN="${CLEAN_TOKEN}" gh release view "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            GH_TOKEN="${CLEAN_TOKEN}" gh release create "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" --title "${TAG_NAME}" --generate-notes
          fi

          GH_TOKEN="${CLEAN_TOKEN}" gh release upload "${TAG_NAME}" "${files[@]}" --repo "${RELEASE_REPOSITORY}" --clobber

      - name: Upload Windows installers
        if: matrix.os_label == 'windows'
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find "src-tauri/target/release/bundle" -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' -o -name '*.sig' \) -print0)

          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Windows installers found to upload."
            exit 1
          fi

          if ! GH_TOKEN="${CLEAN_TOKEN}" gh release view "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            GH_TOKEN="${CLEAN_TOKEN}" gh release create "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" --title "${TAG_NAME}" --generate-notes
          fi

          GH_TOKEN="${CLEAN_TOKEN}" gh release upload "${TAG_NAME}" "${files[@]}" --repo "${RELEASE_REPOSITORY}" --clobber

  publish-latest-json:
    needs:
      - build-macos-installers
      - build-linux-windows-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate distribution release token
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          GH_TOKEN="${CLEAN_TOKEN}" gh api "repos/${RELEASE_REPOSITORY}" >/dev/null

      - name: Download updater metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-metadata
          merge-multiple: true

      - name: Build latest.json
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          jq -s --arg version "${VERSION}" --arg pub_date "${PUB_DATE}" '
            reduce .[] as $item (
              {
                version: $version,
                pub_date: $pub_date,
                platforms: {}
              };
              .platforms += ($item.platforms // {})
            )
          ' updater-metadata/*.json > latest.json

      - name: Upload latest.json to release
        shell: bash
        env:
          POLITEDB_RELEASE_TOKEN: ${{ secrets.POLITEDB_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${POLITEDB_RELEASE_TOKEN:-}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}"

          if [ -z "${CLEAN_TOKEN}" ]; then
            echo "Missing required secret: POLITEDB_RELEASE_TOKEN"
            exit 1
          fi
          test -f latest.json

          if ! GH_TOKEN="${CLEAN_TOKEN}" gh release view "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" >/dev/null 2>&1; then
            GH_TOKEN="${CLEAN_TOKEN}" gh release create "${TAG_NAME}" --repo "${RELEASE_REPOSITORY}" --title "${TAG_NAME}" --generate-notes
          fi

          GH_TOKEN="${CLEAN_TOKEN}" gh release upload "${TAG_NAME}" latest.json --repo "${RELEASE_REPOSITORY}" --clobber
